name: Monthly Database Rebuild

on:
  schedule:
    - cron: '0 2 1 * *'   # 1st of every month at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

jobs:
  rebuild:
    name: Rebuild ICAO Runway Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ETL build script
        run: node scripts/build-db.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/runways.json data/runways-flat.json data/runways.csv data/stats.json
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          TOTAL=$(node -e "const s=require('./data/stats.json'); console.log(s.total_runways.toLocaleString())")
          AIRPORTS=$(node -e "const s=require('./data/stats.json'); console.log(s.total_airports_with_runways.toLocaleString())")
          git commit -m "chore: monthly rebuild ${BUILD_DATE} — ${TOTAL} runways / ${AIRPORTS} airports"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "No changes in runway data. Skipping commit."
